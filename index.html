<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleb Jao — Personal OS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
}

body {
    overflow-y: auto;
}

/* =========================================================
   BLANK WHITE GATE
   ========================================================= */

#blank {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 99999;
    opacity: 1;
    visibility: visible;
    transition: opacity .75s ease, visibility .75s ease;
}

#blank.unlocking {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   BOOT
   ========================================================= */

#boot {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background:
        radial-gradient(circle at center, #0b1724 0%, #03070b 55%, #010204 100%);
    color: #dcecff;
    z-index: 99998;
    opacity: 1;
}

#boot.active {
    display: flex;
}

.boot-logo {
    font-size: clamp(42px, 9vw, 100px);
    font-weight: 800;
    letter-spacing: 12px;
    color: #eaf4ff;
    text-shadow:
        0 0 15px rgba(120, 190, 255, .45),
        0 0 45px rgba(50, 130, 255, .18);
    text-align: center;
}

.boot-subtitle {
    margin-top: 12px;
    color: #66829d;
    font-size: 9px;
    letter-spacing: 5px;
    text-align: center;
}

.boot-progress {
    width: min(360px, 70vw);
    height: 2px;
    margin-top: 42px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
}

.boot-progress::after {
    content: "";
    display: block;
    width: 0;
    height: 100%;
    background: #72baff;
    box-shadow: 0 0 14px #72baff;
    animation: bootProgress 2.8s ease forwards;
}

.boot-status {
    margin-top: 14px;
    font-size: 8px;
    letter-spacing: 2px;
    color: #49647d;
    animation: statusPulse 1s infinite;
    text-align: center;
}

@keyframes bootProgress {
    0% {
        width: 0;
    }

    100% {
        width: 100%;
    }
}

@keyframes statusPulse {
    50% {
        opacity: .35;
    }
}

/* =========================================================
   MAIN EXPERIENCE
   ========================================================= */

#experience {
    position: relative;
    min-height: 100vh;
    color: #dcecff;
    background:
        radial-gradient(circle at 50% 25%, rgba(19, 48, 77, .55), transparent 42%),
        linear-gradient(180deg, #071019 0%, #02070b 100%);
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease, visibility 1s ease;
}

#experience.active {
    opacity: 1;
    visibility: visible;
}

.grid {
    position: absolute;
    left: -20%;
    right: -20%;
    bottom: -42%;
    height: 75%;
    opacity: .18;
    background-image:
        linear-gradient(rgba(80,145,205,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,145,205,.18) 1px, transparent 1px);
    background-size: 70px 70px;
    transform: perspective(500px) rotateX(65deg);
    transform-origin: center top;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
    pointer-events: none;
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(45, 120, 210, .07);
    filter: blur(80px);
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #7cbcff;
    opacity: .25;
    animation: floatParticle linear infinite;
    pointer-events: none;
}

@keyframes floatParticle {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-120vh);
    }
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    position: relative;
    z-index: 5;
    min-height: 70px;
    display: grid;
    grid-template-columns: minmax(130px, 1fr) auto minmax(130px, 1fr);
    align-items: center;
    gap: 20px;
    padding: 12px 30px;
    border-bottom: 1px solid rgba(255,255,255,.045);
}

.brand {
    min-width: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #dcecff;
    white-space: nowrap;
}

.brand span {
    color: #4c7191;
}

.assistant {
    min-width: 0;
    font-size: 8px;
    letter-spacing: 2px;
    color: #5f7890;
    text-transform: uppercase;
    text-align: center;
    overflow-wrap: anywhere;
}

.clock {
    min-width: 0;
    justify-self: end;
    text-align: right;
    color: #70889d;
    font-size: 8px;
    line-height: 1.7;
    letter-spacing: 1px;
}

.clock strong {
    display: block;
    color: #c5d9eb;
    font-size: 10px;
}

/* =========================================================
   CONTENT
   ========================================================= */

.content {
    position: relative;
    z-index: 3;
    width: min(900px, 92vw);
    margin: 0 auto;
    padding: 11vh 0 90px;
    text-align: center;
}

.eyebrow {
    color: #55758e;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(48px, 9vw, 110px);
    line-height: .9;
    letter-spacing: -5px;
    font-weight: 800;
    color: #eef7ff;
    text-shadow: 0 0 35px rgba(100,180,255,.08);
}

.subtitle {
    margin-top: 22px;
    color: #536b7e;
    font-size: 10px;
    letter-spacing: 4px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.google-search {
    width: min(720px, 88vw);
    margin: 44px auto 0;
    position: relative;
}

.search-box {
    display: flex;
    align-items: stretch;
    width: 100%;
    min-height: 44px;
    border: 1px solid rgba(140,190,230,.12);
    background: rgba(255,255,255,.025);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color .25s ease, background .25s ease;
}

.search-box:focus-within {
    border-color: rgba(100,170,235,.35);
    background: rgba(255,255,255,.035);
}

.search-box input {
    flex: 1 1 260px;
    min-width: 0;
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #dcecff;
    padding: 0 15px;
    font-size: 11px;
}

.search-box input::placeholder {
    color: #4d6477;
}

.search-engine {
    flex: 0 0 auto;
    min-width: 88px;
    border: 0;
    border-left: 1px solid rgba(255,255,255,.05);
    outline: 0;
    padding: 0 10px;
    background: #08121b;
    color: #60788d;
    font-size: 8px;
    letter-spacing: 1px;
}

.search-button {
    flex: 0 0 auto;
    min-width: 82px;
    border: 0;
    border-left: 1px solid rgba(255,255,255,.05);
    padding: 0 17px;
    background: rgba(70,140,220,.07);
    color: #8db9dc;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
}

.search-button:hover {
    background: rgba(70,140,220,.15);
    color: #c9e5ff;
}

/* =========================================================
   BING NEWS BUTTONS
   ========================================================= */

.news-buttons {
    width: min(720px, 88vw);
    margin: 10px auto 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 7px;
}

.news-buttons a {
    flex: 0 0 auto;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.065);
    border-radius: 7px;
    background: rgba(255,255,255,.025);
    color: #61788f;
    text-decoration: none;
    font-size: 7px;
    font-weight: 600;
    letter-spacing: 1.2px;
    white-space: nowrap;
    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .2s ease;
}

.news-buttons a:hover {
    background: rgba(70,140,220,.10);
    border-color: rgba(100,170,255,.28);
    color: #a9cfff;
    transform: translateY(-1px);
}

/* =========================================================
   RESULTS
   ========================================================= */

.results-panel {
    width: min(720px, 88vw);
    margin: 18px auto 0;
    display: none;
    text-align: left;
}

.results-panel.active {
    display: block;
}

.results-header {
    color: #49657b;
    font-size: 7px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.result {
    display: block;
    width: 100%;
    padding: 12px 13px;
    margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,.04);
    border-radius: 7px;
    background: rgba(255,255,255,.018);
    text-decoration: none;
    overflow-wrap: anywhere;
    transition: background .2s ease, border-color .2s ease;
}

.result:hover {
    background: rgba(80,145,210,.06);
    border-color: rgba(100,170,230,.12);
}

.result-title {
    color: #a9c9e5;
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 4px;
    overflow-wrap: anywhere;
}

.result-url {
    color: #49677e;
    font-size: 7px;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.result-description {
    color: #60798d;
    font-size: 8px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.loading,
.error {
    color: #536d82;
    font-size: 8px;
    letter-spacing: 1px;
    padding: 15px;
    text-align: center;
}

.find-more {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 10px auto 0;
    color: #5f8aae;
    font-size: 7px;
    letter-spacing: 1.5px;
    text-decoration: none;
    text-align: center;
}

/* =========================================================
   SYSTEM CARDS
   ========================================================= */

.system-cards {
    width: min(720px, 88vw);
    margin: 28px auto 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
}

.system-card {
    min-width: 0;
    padding: 14px 10px;
    border: 1px solid rgba(255,255,255,.04);
    border-radius: 7px;
    background: rgba(255,255,255,.015);
    overflow-wrap: anywhere;
}

.system-card-label {
    color: #405a6d;
    font-size: 6px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.system-card-value {
    color: #829caf;
    font-size: 8px;
}

/* =========================================================
   LOCK
   ========================================================= */

.lock {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    border: 1px solid rgba(255,255,255,.05);
    background: rgba(2,7,11,.55);
    color: #3e5669;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 6px;
    letter-spacing: 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .2s ease, border-color .2s ease;
}

.lock:hover {
    color: #7b9bb5;
    border-color: rgba(255,255,255,.12);
}

/* =========================================================
   RESPONSIVE / NO OVERLAP
   ========================================================= */

@media (max-width: 760px) {
    .topbar {
        grid-template-columns: 1fr auto;
        grid-template-areas:
            "brand clock"
            "assistant assistant";
        gap: 8px 12px;
        padding: 12px 16px;
    }

    .brand {
        grid-area: brand;
    }

    .clock {
        grid-area: clock;
    }

    .assistant {
        grid-area: assistant;
        width: 100%;
        padding-top: 2px;
    }

    .content {
        padding-top: 8vh;
    }

    h1 {
        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 8px;
        line-height: 1.7;
        letter-spacing: 2px;
    }

    .search-box {
        flex-wrap: wrap;
        overflow: visible;
        min-height: 0;
    }

    .search-box input {
        flex: 1 1 100%;
        height: 42px;
        border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .search-engine {
        flex: 1 1 50%;
        min-height: 40px;
        border-left: 0;
        border-right: 1px solid rgba(255,255,255,.05);
    }

    .search-button {
        flex: 1 1 50%;
        min-height: 40px;
        border-left: 0;
    }

    .news-buttons {
        justify-content: center;
    }

    .system-cards {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 430px) {
    .topbar {
        grid-template-columns: 1fr;
        grid-template-areas:
            "brand"
            "clock"
            "assistant";
        text-align: center;
    }

    .brand,
    .clock {
        justify-self: center;
        text-align: center;
    }

    .content {
        width: min(94vw, 720px);
    }

    .google-search,
    .news-buttons,
    .results-panel,
    .system-cards {
        width: 94vw;
    }

    .news-buttons a {
        flex: 1 1 auto;
    }

    .lock {
        bottom: 12px;
    }
}

/* Very short screens */
@media (max-height: 650px) and (min-width: 761px) {
    .content {
        padding-top: 6vh;
    }

    .google-search {
        margin-top: 28px;
    }

    .system-cards {
        margin-top: 20px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
    }
}
</style>
</head>

<body>

<!--
    The page intentionally starts completely white.
    Type the secret unlock sequence on the keyboard to continue.
-->
<div id="blank" aria-hidden="true"></div>

<div id="boot">
    <div class="boot-logo">CJAO</div>
    <div class="boot-subtitle">PERSONAL OPERATING SYSTEM</div>
    <div class="boot-progress"></div>

</div>

<div id="experience">

    <div class="particle" style="left:27%;top:85%;animation-duration:12s;"></div>
    <div class="particle" style="left:39%;top:95%;animation-duration:20s;"></div>
    <div class="particle" style="left:53%;top:80%;animation-duration:16s;"></div>
    <div class="particle" style="left:66%;top:92%;animation-duration:13s;"></div>
    <div class="particle" style="left:77%;top:75%;animation-duration:19s;"></div>
    <div class="particle" style="left:89%;top:88%;animation-duration:15s;"></div>

    <header class="topbar">

        </div>

        </div>

        <form class="google-search" id="searchForm">

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    autocomplete="off"
                    placeholder="Search the web..."

                >

            <a
                href="https://www.bing.com/news"
                target="_blank"

            >TOP STORIES</a>

            <a
                href="https://www.bing.com/news/search?q=US+News"
                target="_blank"
                rel="noopener noreferrer"
            >US</a>

                href="https://www.bing.com/news/search?q=World+News"
                target="_blank"

            >WORLD</a>

                href="https://www.bing.com/news/search?q=Business+News"
                target="_blank"

                href="https://www.bing.com/news/search?q=Technology+News"
                target="_blank"

            </div>

                href="#"
                class="find-more"
                id="findMore"

            >
                FIND MORE RESULTS →
            </a>

        <div class="system-cards">

            <div class="system-card">
                <div class="system-card-label">STATUS</div>
                <div class="system-card-value">ONLINE</div>
            </div>

            <div class="system-card">
                <div class="system-card-label">CORE</div>
                <div class="system-card-value">CJAO OS</div>
            </div>

        </div>

    </main>

    <button
        class="lock"

        LOCK SYSTEM

<script>
/* =========================================================
   ELEMENTS
   ========================================================= */

const blank = document.getElementById("blank");
const boot = document.getElementById("boot");
const experience = document.getElementById("experience");

const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const searchEngine = document.getElementById("searchEngine");
const resultsPanel = document.getElementById("resultsPanel");
const results = document.getElementById("results");
const resultsHeader = document.getElementById("resultsHeader");
const findMore = document.getElementById("findMore");

const assistant = document.getElementById("assistant");
const timeElement = document.getElementById("time");
const dateElement = document.getElementById("date");

/* =========================================================
   SEARCH CONFIG
   ========================================================= */

const engineConfig = {
    google: {
        searchURL: "https://www.google.com/search?q=",
        readerURL: "https://r.jina.ai/http://www.google.com/search?q="
    },

    bing: {
        searchURL: "https://www.bing.com/search?q=",
        readerURL: "https://r.jina.ai/http://www.bing.com/search?q="
    },

    yahoo: {
        searchURL: "https://search.yahoo.com/search?p=",
        readerURL: "https://r.jina.ai/http://search.yahoo.com/search?p="
    }
};

/* =========================================================
   ASSISTANT
   ========================================================= */

const assistantMessages = [
    "PERSONAL OS ONLINE",
    "SYSTEM READY",
    "WELCOME BACK, CALEB",
    "ALL SYSTEMS NOMINAL",
    "AWAITING COMMAND",
    "CORE SYSTEM ACTIVE"
];

let assistantIndex = 0;

/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {
    const now = new Date();

    timeElement.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    dateElement.textContent = now
        .toLocaleDateString([], {
            weekday: "short",
            month: "short",
            day: "numeric",
            year: "numeric"
        })
        .toUpperCase();
}

updateClock();
setInterval(updateClock, 1000);

/* =========================================================
   ASSISTANT ROTATION
   ========================================================= */

setInterval(() => {
    assistantIndex =
        (assistantIndex + 1) % assistantMessages.length;

    assistant.textContent =
        assistantMessages[assistantIndex];
}, 20000);

/* =========================================================
   STARTUP SOUND
   ========================================================= */

function startupSound() {
    try {
        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            220,
            ctx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            880,
            ctx.currentTime + 0.45
        );

        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.06,
            ctx.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 0.5
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.5);

    } catch (error) {
        /* Audio is optional. */
    }
}

/* =========================================================
   BOOT SEQUENCE
   ========================================================= */

function startBoot() {

    blank.classList.add("unlocking");

    setTimeout(() => {
        boot.classList.add("active");

        setTimeout(() => {

            boot.style.transition =
                "opacity .8s ease";

            boot.style.opacity = "0";

            setTimeout(() => {

                boot.classList.remove("active");
                boot.style.opacity = "1";
                boot.style.transition = "";

                experience.classList.add("active");

                startupSound();

            }, 800);

        }, 3000);

    }, 250);
}

/* =========================================================
   SECRET WHITE-SCREEN UNLOCK
   ========================================================= */

const unlockSequence = "alberte=mc2*";
let unlockBuffer = "";

function handleUnlockKey(event) {

    if (!blank || blank.classList.contains("unlocking")) {
        return;
    }

    /*
        Ignore control keys, arrows, etc.
        The password is entered directly from the keyboard
        while the page remains completely white.
    */
    if (event.key.length !== 1) {
        return;
    }

    unlockBuffer += event.key;

    if (unlockBuffer.length > unlockSequence.length) {
        unlockBuffer =
            unlockBuffer.slice(-unlockSequence.length);
    }

    if (unlockBuffer === unlockSequence) {
        unlockBuffer = "";
        startBoot();
    }
}

document.addEventListener("keydown", handleUnlockKey);

/* =========================================================
   SEARCH HELPERS
   ========================================================= */

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function cleanURL(url) {
    return String(url)
        .replace(/^https?:\/\//i, "")
        .replace(/^www\./i, "")
        .split(/[?#]/)[0];
}

/* =========================================================
   EXTRACT RESULTS
   ========================================================= */

function extractResults(text) {

    const found = [];
    const seen = new Set();

    const markdownLinks = [
        ...text.matchAll(
            /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g
        )
    ];

    for (const match of markdownLinks) {

        const title = match[1].trim();
        const url = match[2].trim();

        if (!url || !title) {
            continue;
        }

        const lowerURL = url.toLowerCase();

        if (
            lowerURL.includes("bing.com") ||
            lowerURL.includes("google.com") ||
            lowerURL.includes("yahoo.com") ||
            lowerURL.includes("microsoft.com")
        ) {
            continue;
        }

        if (seen.has(url)) {
            continue;
        }

        seen.add(url);

        found.push({
            title,
            url,
            description: ""
        });
    }

    const plainURLs = [
        ...text.matchAll(
            /https?:\/\/[^\s<>)]+/g
        )
    ];

    for (const match of plainURLs) {

        const url =
            match[0].replace(/[.,;]+$/, "");

        if (!url) {
            continue;
        }

        const lowerURL = url.toLowerCase();

        if (
            lowerURL.includes("bing.com") ||
            lowerURL.includes("google.com") ||
            lowerURL.includes("yahoo.com") ||
            lowerURL.includes("microsoft.com")
        ) {
            continue;
        }

        if (seen.has(url)) {
            continue;
        }

        seen.add(url);

        found.push({
            title: cleanURL(url),
            url,
            description: ""
        });
    }

    return found.slice(0, 5);
}

/* =========================================================
   SEARCH
   ========================================================= */

async function performSearch(query) {

    const engine = searchEngine.value;
    const config = engineConfig[engine];

    resultsPanel.classList.add("active");

    resultsHeader.textContent = "SEARCHING...";

    results.innerHTML =
        '<div class="loading">CONNECTING TO SEARCH ENGINE...</div>';

    findMore.href =
        config.searchURL +
        encodeURIComponent(query);

    try {

        const response = await fetch(
            config.readerURL +
            encodeURIComponent(query),
            {
                method: "GET"
            }
        );

        if (!response.ok) {
            throw new Error("Search request failed.");
        }

        const text = await response.text();
        const items = extractResults(text);

        if (!items.length) {

            resultsHeader.textContent =
                "NO RESULTS FOUND";

            results.innerHTML =
                '<div class="error">OPEN THE SEARCH ENGINE FOR MORE RESULTS.</div>';

            return;
        }

        resultsHeader.textContent =
            `${engine.toUpperCase()} RESULTS`;

        results.innerHTML = items
            .map(item => {

                const description =
                    item.description
                        ? `<div class="result-description">${escapeHTML(item.description)}</div>`
                        : "";

                return `
                    <a
                        class="result"
                        href="${escapeHTML(item.url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <div class="result-title">
                            ${escapeHTML(item.title)}
                        </div>

                        <div class="result-url">
                            ${escapeHTML(cleanURL(item.url))}
                        </div>

                        ${description}
                    </a>
                `;
            })
            .join("");

    } catch (error) {

        resultsHeader.textContent =
            "SEARCH UNAVAILABLE";

        results.innerHTML = `
            <div class="error">
                COULDN'T LOAD RESULTS. USE FIND MORE RESULTS BELOW.
            </div>
        `;
    }
}

/* =========================================================
   SEARCH FORM
   ========================================================= */

searchForm.addEventListener("submit", event => {

    event.preventDefault();

    const query =
        searchInput.value.trim();

    if (!query) {
        searchInput.focus();
        return;
    }

    performSearch(query);
});

/* =========================================================
   LOCK SYSTEM
   ========================================================= */

document.getElementById("lock").addEventListener("click", () => {

    experience.classList.remove("active");

    setTimeout(() => {

        boot.style.transition =
            "opacity .6s ease";

        boot.style.opacity = "0";
        boot.classList.remove("active");

        /*
            Return to the original completely white
            secret-entry screen rather than reloading
            the document.
        */
        blank.classList.remove("unlocking");
        blank.style.opacity = "1";
        blank.style.visibility = "visible";
        blank.style.pointerEvents = "auto";

        unlockBuffer = "";

    }, 600);
});
